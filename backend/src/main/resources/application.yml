server:
  port: 8080

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/leonbon}

app:
  cors:
    allowedOrigins:
      - ${CORS_ORIGIN_1:http://localhost:5173}

  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}
      issuer: ${JWT_ISSUER:leonbon}
      ttlMinutes: ${JWT_TTL_MINUTES:10080} # 7 days

  economy:
    welcomeBonus: ${WELCOME_BONUS:5000}
    dailyClaimAmount: ${DAILY_CLAIM_AMOUNT:100}
    timezone: ${LEON_TIMEZONE:America/Los_Angeles}
    dailyResetHour: ${DAILY_RESET_HOUR:17} # 5pm

